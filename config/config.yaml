# ─── Rutas ────────────────────────────────────────────────────────────
paths:
  data_raw: "data/raw/studentmat.csv"
  data_processed: "data/processed/"
  models: "models/"
  reports: "reports/"

# ─── Reproducibilidad ──────────────────────────────────────────────────
random_seed: 42

# ─── Datos ────────────────────────────────────────────────────────────
data:
  expected_rows_min: 1000
  expected_columns: 21

# ─── Features ─────────────────────────────────────────────────────────
features:
  drop_columns:
    - student_id
    - age
    - gender
    - academic_level
    - internet_quality
    - online_classes_hours
    - gaming_hours

  feature_columns:
    - study_hours
    - self_study_hours
    - social_media_hours
    - sleep_hours
    - screen_time_hours
    - exercise_minutes
    - caffeine_intake_mg
    - part_time_job
    - upcoming_deadline
    - mental_health_score
    - focus_index
    - burnout_level
    - productivity_score

  source_score_column: exam_score

# ─── Target ───────────────────────────────────────────────────────────
target:
  name: aprobado
  source: exam_score
  strategy: median
  fixed_threshold: 18.0
  positive_class_label: 1

# ─── Split ────────────────────────────────────────────────────────────
split:
  test_size: 0.2
  stratify: true

# ─── Modelo ───────────────────────────────────────────────────────────
model:
  decision_tree:
    max_depth: 5
    criterion: gini
    min_samples_split: 2
    min_samples_leaf: 1

  smote:
    enabled: true
    sampling_strategy: auto
    k_neighbors: 5

  artifact_name: "decision_tree_v1.joblib"

# ─── Evaluación ───────────────────────────────────────────────────────
evaluation:
  # Nombres de las clases para mostrar en reportes
  class_names:
    - Reprueba
    - Aprueba

  # Subcarpeta dentro de reports/ donde se guardan los outputs
  output_subdir: "v1"

  # Configuración de gráficas
  figures:
    dpi: 100
    figsize_confusion: [6, 5]
    figsize_roc: [7, 6]
    figsize_importance: [9, 6]